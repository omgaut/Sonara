[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sonora"
version = "0.1.0"
description = "Text-free generative speech modeling experiments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "certifi",
  "encodec",
  "torch",
  "torchaudio",
  "numpy",
  "soundfile",
  "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]
